version: "3.9"

services:
  flix-reversi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flix-reversi-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env.example
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - ROOM_STORE_PATH=/app/data/rooms_snapshot.json
    volumes:
      - flix_reversi_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  flix_reversi_data:
